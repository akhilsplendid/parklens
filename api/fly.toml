# Fly.io config for the ParkLens API. First time:  fly launch --copy-config --no-deploy
# then:  fly secrets set MODEL_API_KEY=...   and   fly deploy
app = "parklens-api"
primary_region = "arn"   # Stockholm

[build]
  dockerfile = "Dockerfile"

[env]
  KB_PATH = "/app/kb.json"
  PARK_NAME = "Kolmården"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
